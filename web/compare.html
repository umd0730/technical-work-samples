<!doctype html><html lang="en"><head><link rel="icon" href="data:,"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Responsive repair — before / after</title><style>*{box-sizing:border-box}body{margin:0;font:14px/1.5 Arial,sans-serif;background:#e7ebe7;color:#20382b}header{padding:20px 28px;background:#20382b;color:white}h1{font:26px Georgia,serif;margin:0 0 8px}p{margin:0 0 12px}label{display:inline-block;margin-right:8px}select,a{font:inherit;padding:8px;margin-right:16px}header a{color:white}main{padding:24px;overflow:auto}iframe{display:block;background:white;border:1px solid #8b9986;height:920px;max-width:none;margin:0 auto;box-shadow:0 10px 25px #20382b20}#result{padding-top:14px;font-family:monospace}</style></head><body><header><h1>Responsive repair / compare the same page</h1><p>Self-initiated demo. “Before” intentionally recreates a fixed-width bug. No client work is implied.</p><label for="version">Version</label><select id="version"><option value="after">After — repaired</option><option value="before">Before — fixed-width bug</option></select><label for="width">Viewport</label><select id="width"><option>320</option><option selected>390</option><option>768</option><option>1280</option></select><a href="index.html" target="_blank">Open repaired page</a><div id="result" role="status"></div></header><main><iframe title="Responsive demo viewport" src="index.html" style="width:390px"></iframe></main><script>
const frame=document.querySelector('iframe'),version=document.querySelector('#version'),width=document.querySelector('#width');
function measure(){const d=frame.contentDocument;document.querySelector('#result').textContent=`${version.value}: viewport ${d.documentElement.clientWidth}px / document ${d.documentElement.scrollWidth}px / overflow ${d.documentElement.scrollWidth>d.documentElement.clientWidth?'YES':'NO'}`;}
function update(){frame.style.width=width.value+'px';const d=frame.contentDocument;let broken=d.querySelector('#broken-fixture');if(version.value==='before'&&!broken){broken=d.createElement('link');broken.id='broken-fixture';broken.rel='stylesheet';broken.href='broken.css';broken.onload=measure;d.head.append(broken);}else if(version.value==='after'&&broken){broken.remove();}requestAnimationFrame(()=>requestAnimationFrame(measure));}
frame.addEventListener('load',update);version.addEventListener('change',update);width.addEventListener('change',update);
</script></body></html>
